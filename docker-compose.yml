services:
  sni:
    # Built and pushed by CI (.github/workflows/image.yml); one image for every node.
    # `build` is the fallback when the image cannot be pulled, and for `up --build` locally.
    image: ghcr.io/misqzy/remnasni:latest
    build: .
    container_name: remnasni
    restart: unless-stopped
    # NODE_COUNTRY picks the flag, REMNAWEB_URL enables Telegram sign-in; see .env.example.
    environment:
      - NODE_COUNTRY=${NODE_COUNTRY:-de}
      - REMNAWEB_URL=${REMNAWEB_URL:-}
    # Only reachable locally: put nginx/caddy with the node's TLS cert in front
    # and point Xray REALITY `target` (self-SNI) at it.
    ports:
      - "127.0.0.1:${PORT:-8080}:3000"
