name: Caddy image

# Caddy + Cloudflare DNS module for the nodes. Rebuilt when caddy/ changes and monthly,
# so nodes pick up Caddy and module updates with a plain `docker compose pull`.
on:
  push:
    branches: [main]
    paths: [caddy/**, .github/workflows/caddy.yml]
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-caddy

jobs:
  image:
    name: Build & Push Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # The image must work: fail the build if the module did not make it in.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: caddy
          load: true
          tags: caddy-cloudflare:test
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Check Cloudflare module and Caddyfile
        run: |
          docker run --rm caddy-cloudflare:test caddy list-modules | grep -q '^dns.providers.cloudflare$'
          docker run --rm -e DOMAIN=example.com -e CF_API_TOKEN=0000000000000000000000000000000000000000 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy-cloudflare:test \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=caddy
